services:
  postgres:
    image: postgres:16
    container_name: fixora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixora
      POSTGRES_USER: fixora
      POSTGRES_PASSWORD: fixora
    ports:
      - "5432:5432"
    volumes:
      - fixora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixora -d fixora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fixora_pgdata:
